
<!DOCTYPE html>
<html>
<head>
    <title>Dog Adoption Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Dog Adoption Application</h1>

        <form>
            <input type="text" id="name" placeholder="Name" required>

            <input type="text" id="phone" placeholder="Phone Number" required>

            <input type="text" id="address" placeholder="Address" required>

            <div class="checkbox-group">
                <input type="checkbox" id="checkbox"
                       value="Have you ever lived with a Dog before?">
                <label for="checkbox">
                    Have you ever lived with a Dog before?
                </label>
            </div>

            <label for="multiSelect">
                Please select your preferred breeds
            </label>

            <select id="multiSelect" multiple required>
                <option value="Labrador">Labrador</option>
                <option value="German Shepherd">German Shepherd</option>
                <option value="Golden Retriever">Golden Retriever</option>
                <option value="Beagle">Beagle</option>
            </select>

            <input type="submit" id="submit" value="Submit">
        </form>
    </div>

    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
